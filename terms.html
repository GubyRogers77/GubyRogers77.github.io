/* =========================================================
   EIL CONFERENCE 2026 - TAILWIND THEME
   Display / Body / UI: Satoshi
   ========================================================= */

@theme {
  /* ---------- Palette (modern SaaS / OneRoadmap-inspired) ---------- */
  --color-navy: #0A0A0A;
  --color-navy-700: #111111;
  --color-navy-600: #1A1A1A;
  --color-gold: #D4A853;
  --color-gold-light: #EAC97D;
  --color-coral: #E8637A;
  --color-coral-deep: #C94B62;
  --color-violet: #9333EA;
  --color-violet-light: #A855F7;
  --color-violet-mist: #D8B4FE;
  --color-violet-border: #4C2D82;
  --color-violet-ink: #1A102E;
  --color-blue: #2563EB;
  --color-blue-deep: #1D4ED8;
  --color-pink: #EC4899;
  --color-pink-light: #F472B6;
  --color-cream: #F9FAFB;
  --color-paper: #FFFFFF;
  --color-ink: #111827;
  --color-ink-soft: #374151;
  --color-slate: #D1D5DB;
  --color-positive: #3E8E5C;
  --color-line: rgba(17,24,39,0.10);
  --color-line-dark: rgba(255,255,255,0.10);
  --color-line-warm: rgba(168,85,247,0.28);

  /* ---------- Shadows ---------- */
  --shadow-warm-sm: 0 1px 2px rgba(0,0,0,0.04), 0 12px 28px -18px rgba(0,0,0,0.12);
  --shadow-warm-md: 0 4px 10px rgba(0,0,0,0.05), 0 24px 48px -24px rgba(0,0,0,0.18);
  --shadow-warm-dark: 0 24px 60px -20px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.04) inset;

  /* ---------- Families ---------- */
  --font-sans:'Satoshi', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display:'Satoshi', ui-sans-serif, system-ui, sans-serif;
  --font-mono:'Satoshi', ui-sans-serif, system-ui, sans-serif;
  --font-syne:'Satoshi', ui-sans-serif, system-ui, sans-serif;

  /* ---------- Type scale ---------- */
  --text-3xs:0.625rem;
  --text-3xs--line-height:1.4;
  --text-2xs:0.6875rem;
  --text-2xs--line-height:1.4;
  --text-xs:0.75rem;
  --text-xs--line-height:1.45;
  --text-sm:0.8125rem;
  --text-sm--line-height:1.55;
  --text-base:0.875rem;
  --text-base--line-height:1.55;
  --text-base--letter-spacing:-0.006em;
  --text-md:clamp(0.9375rem, 0.91rem + 0.11vw, 1rem);
  --text-md--line-height:1.5;
  --text-md--letter-spacing:-0.006em;
  --text-body:clamp(1rem, 0.97rem + 0.11vw, 1.0625rem);
  --text-body--line-height:1.62;
  --text-body--letter-spacing:-0.006em;
  --text-lg:clamp(1.0625rem, 1rem + 0.22vw, 1.1875rem);
  --text-lg--line-height:1.58;
  --text-lg--letter-spacing:-0.006em;
  --text-xl:clamp(1.1875rem, 1.11rem + 0.22vw, 1.3125rem);
  --text-xl--line-height:1.3;
  --text-xl--letter-spacing:-0.015em;
  --text-2xl:clamp(1.375rem, 1.24rem + 0.33vw, 1.5625rem);
  --text-2xl--line-height:1.24;
  --text-2xl--letter-spacing:-0.015em;
  --text-3xl:clamp(1.375rem, 1.22rem + 0.55vw, 1.75rem);
  --text-3xl--line-height:1.2;
  --text-3xl--letter-spacing:-0.02em;
  --text-4xl:clamp(1.5rem, 1.28rem + 0.85vw, 2rem);
  --text-4xl--line-height:1.18;
  --text-4xl--letter-spacing:-0.022em;
  --text-5xl:clamp(1.75rem, 1.4rem + 1.3vw, 2.5rem);
  --text-5xl--line-height:1.12;
  --text-5xl--letter-spacing:-0.025em;
  --text-6xl:clamp(2rem, 1.5rem + 1.8vw, 3rem);
  --text-6xl--line-height:1.1;
  --text-6xl--letter-spacing:-0.028em;

  /* ---------- Tracking ---------- */
  --tracking-tight:-0.015em;
  --tracking-wide:0.06em;
  --tracking-caps:0.12em;
  --tracking-eyebrow:0.14em;

  /* ---------- Radii, shadows, container ---------- */
  --radius-card:20px;
  --radius-panel:14px;
  --radius-field:10px;
  --shadow-card:0 1px 2px rgba(0,0,0,0.04), 0 12px 32px -16px rgba(0,0,0,0.12);
  --shadow-lift:0 30px 70px -25px rgba(0,0,0,0.5);
  --shadow-gold:0 12px 24px -10px rgba(147,51,234,0.35);
  --shadow-nav:0 1px 0 rgba(255,255,255,0.06), 0 24px 48px -32px rgba(0,0,0,0.45);
  --shadow-menu:0 28px 56px -28px rgba(0,0,0,0.5);
  --shadow-hero:0 24px 60px -20px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.04) inset;
  --shadow-logo:0 6px 16px -6px rgba(147,51,234,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
  --shadow-logo-lift:0 8px 20px -6px rgba(147,51,234,0.55), inset 0 1px 0 rgba(255,255,255,0.35);
  --shadow-cta:0 10px 15px -3px rgba(168,85,247,0.25), 0 4px 6px -4px rgba(168,85,247,0.25);
  --shadow-cta-ghost:0 10px 26px -16px rgba(147,51,234,0.35);
  --shadow-tag:0 4px 12px -4px rgba(0,0,0,0.35);
  --shadow-plan:0 24px 60px -20px rgba(0,0,0,0.5);
  --shadow-badge:0 10px 24px -8px rgba(147,51,234,0.35), 0 0 0 4px var(--color-paper);
  --shadow-chip:0 10px 22px -14px rgba(14,26,43,0.22);

  --ease-lift:cubic-bezier(.22,1,.36,1);
  --container-page:1180px;
}

/* The browser build compiles from classes it can see in the markup, so any
   utility that only ever arrives via JS has to be declared here. */
@source inline("grid-rows-[1fr] rotate-45 flex");

@layer base {
  body{
    font-feature-settings:'cv05' 1, 'cv08' 1;
  }
  h1, h2, h3, h4{
    font-family:var(--font-display);
    font-weight:500;
    letter-spacing:-0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
      scroll-behavior:auto !important;
    }
  }
}

/* Component classes cover the patterns that repeat across the page; everything
   else is composed with utilities in the markup. Raw declarations appear only
   where Tailwind has no equivalent: variable-font axes, vendor-prefixed
   properties, and the @supports fallback for gradient-filled text.

   Hover styling is written with plain `hover:` variants - Tailwind v4 already
   scopes those to `@media (hover:hover)`, so a tap never leaves a card stuck
   in its lifted state. */
@layer components {
  .shell{ @apply mx-auto w-full max-w-page px-5 md:px-8; }

  /* ---------- Layout rhythm ---------- */
  .section{ @apply py-14 lg:py-16; }
  .section-head{ @apply mb-7 max-w-[34rem]; }
  .section-head-center{ @apply mx-auto mb-7 max-w-[34rem] text-center; }
  .section-title{ @apply font-display text-[1.55rem] font-bold leading-snug tracking-tight text-balance text-ink sm:text-[1.7rem] lg:text-[1.85rem]; }
  .section-title-light{ @apply font-display text-[1.55rem] font-bold leading-snug tracking-tight text-balance text-white sm:text-[1.7rem] lg:text-[1.85rem]; }
  .section-lead{ @apply mt-3 text-[0.95rem] leading-relaxed text-pretty text-ink-soft; }
  .section-lead-light{ @apply mt-3 text-[0.95rem] leading-relaxed text-pretty text-[#D1D5DB]; }
  .hero{ @apply relative overflow-hidden bg-navy pt-20 pb-16 lg:pt-28 lg:pb-24; }
  .hero-title{ @apply font-display text-[1.5rem] font-bold leading-[1.2] tracking-tight text-balance sm:text-[1.7rem] lg:text-[2.05rem]; }
  .page-hero{ @apply relative overflow-hidden bg-navy pt-14 pb-12 lg:pt-16 lg:pb-14; }
  .page-hero-title{ @apply font-display text-[1.55rem] font-bold leading-snug tracking-tight text-balance text-white sm:text-[1.7rem] lg:text-[1.85rem]; }

  .display-italic{
    @apply font-display font-medium tracking-tight text-violet;
  }

  .eyebrow{
    @apply mb-[18px] inline-flex items-center gap-2.5 font-mono text-xs font-medium
           uppercase tracking-eyebrow;
  }
  .eyebrow::before{ @apply inline-block h-px w-[22px] bg-current content-['']; }

  .label{ @apply font-mono text-2xs font-medium uppercase tracking-caps; }

  /* ---------- Badges: Forage-style announcement pill ----------
     Structure: [dot] KICKER · Title - cta →
     Themes: .badge-dark (navy sections) · .badge-light (paper/cream) */
  .badge{
    @apply inline-flex max-w-full items-center gap-2 rounded-full border px-[18px] py-[9px]
           font-sans text-[13px] leading-none tracking-[-0.01em] whitespace-nowrap
           backdrop-blur-[10px] transition duration-200 ease-out;
  }
  @media (max-width: 640px){
    .badge{ @apply max-w-full gap-1.5 px-3.5 py-2 text-xs; }
    .badge .badge-arrow{ @apply hidden; }
  }
  .badge-dot{
    @apply relative inline-flex size-[7px] shrink-0 rounded-full;
    box-shadow:0 0 0 3px color-mix(in srgb, currentColor 28%, transparent),
               0 0 10px color-mix(in srgb, currentColor 55%, transparent);
    animation: badge-dot-core 2.2s ease-in-out infinite;
  }
  .badge-dot::before{
    content:'';
    @apply absolute -inset-[4px] rounded-full bg-current opacity-40;
    animation: badge-dot-ping 2.2s ease-out infinite;
  }
  @keyframes badge-dot-core{ 0%,100%{ opacity:1; } 50%{ opacity:0.72; } }
  @keyframes badge-dot-ping{
    0%{ transform:scale(0.45); opacity:0.45; }
    100%{ transform:scale(1.85); opacity:0; }
  }
  .badge-kicker{
    @apply shrink-0 font-medium uppercase tracking-[0.08em];
  }
  .badge-sep,
  .badge-dash{
    @apply shrink-0 opacity-80;
  }
  .badge-title{
    @apply font-medium text-pretty;
  }
  .badge-cta{
    @apply shrink-0 font-normal;
  }
  .badge-cta.lowercase{ @apply lowercase; }
  .badge-arrow{
    @apply shrink-0 translate-y-px text-[14px] leading-none;
  }

  /* Dark theme - navy headers / dark canvases */
  .badge-dark{
    @apply border-[#4C2D82] bg-[rgba(26,16,46,0.72)] text-[#B89BF8]
           shadow-[0_0_0_1px_rgba(184,155,248,0.04)];
  }
  .badge-dark .badge-dot{ @apply bg-[#B89BF8] text-[#B89BF8]; }
  .badge-dark .badge-kicker,
  .badge-dark .badge-sep,
  .badge-dark .badge-dash,
  .badge-dark .badge-cta,
  .badge-dark .badge-arrow{ @apply text-[#B89BF8]; }
  .badge-dark .badge-title{ @apply text-white; }
  a.badge-dark:hover{
    @apply border-[#B89BF8]/55 bg-[rgba(26,16,46,0.88)];
  }

  /* Light theme - paper / cream / white sections */
  .badge-light{
    @apply border-violet/25 bg-[rgba(147,51,234,0.06)] text-violet
           shadow-[0_2px_12px_-6px_rgba(147,51,234,0.18)];
  }
  .badge-light .badge-dot{ @apply bg-violet text-violet; }
  .badge-light .badge-kicker,
  .badge-light .badge-sep,
  .badge-light .badge-dash,
  .badge-light .badge-cta,
  .badge-light .badge-arrow{ @apply text-violet; }
  .badge-light .badge-title{ @apply text-ink; }
  a.badge-light:hover{
    @apply border-violet/40 bg-[rgba(147,51,234,0.1)];
  }

  /* Legacy color aliases → map to light/dark so older markup still works */
  .badge-violet{ @apply border-violet/25 bg-[rgba(147,51,234,0.06)] text-violet; }
  .badge-violet .badge-dot{ @apply bg-violet text-violet; }
  .badge-pink{ @apply border-pink/25 bg-pink/5 text-pink; }
  .badge-pink .badge-dot{ @apply bg-pink text-pink; }
  .badge-neutral{ @apply border-line bg-white/80 text-ink-soft; }
  .badge-neutral .badge-dot{ @apply bg-ink-soft text-ink-soft; }

  /* Gradient-filled text. Tailwind handles the clip and the transparent fill;
     the @supports guard and -webkit fallback keep solid gold on engines that
     cannot clip a background to glyphs. */
  .text-gold-foil{ color:var(--color-gold-light); }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .text-gold-foil{
      @apply bg-linear-[115deg,#F3D99B_0%,var(--color-gold)_32%,var(--color-gold-light)_58%,#F8ECC2_100%]
             bg-clip-text text-transparent;
      -webkit-text-fill-color:transparent;
    }
  }

  /* OneRoadmap gradient: violet → blue */
  .text-gradient-brand{ color:var(--color-violet); }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .text-gradient-brand{
      @apply bg-linear-[115deg,#C084FC_0%,#9333EA_45%,#2563EB_100%]
             bg-clip-text text-transparent;
      -webkit-text-fill-color:transparent;
    }
  }

  /* ---------- Buttons (sitewide standard) ---------- */
  .btn{
    @apply inline-flex cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-xl
           border border-transparent px-6 py-3 font-display text-sm font-semibold leading-tight
           transition duration-200 ease-out;
  }
  .btn-sm{ @apply w-fit min-h-9 px-4 py-2 text-[13px]; }
  .btn-block{ @apply w-full; }
  .btn-primary,
  .btn-violet{
    @apply bg-linear-to-r from-violet to-blue text-white shadow-cta
           hover:-translate-y-0.5 hover:shadow-[0_14px_24px_-6px_rgba(168,85,247,0.4)];
  }
  .btn-ghost-dark{
    @apply border-white/25 bg-white/10 text-white backdrop-blur-sm
           hover:-translate-y-0.5 hover:border-white/45 hover:bg-white/16;
  }
  .btn-ghost-light{
    @apply border-ink/12 bg-white text-ink shadow-[0_1px_0_rgba(10,10,10,0.04)]
           hover:-translate-y-0.5 hover:border-ink/25 hover:bg-cream;
  }
  .btn-white{
    @apply bg-white text-ink hover:-translate-y-0.5 hover:bg-white/92;
  }
  .btn-shine{
    @apply relative overflow-hidden
           before:absolute before:inset-0 before:-translate-x-[130%]
           before:bg-linear-[120deg,transparent_30%,rgba(255,255,255,0.35)_50%,transparent_70%]
           before:transition-transform before:duration-700 before:ease-out before:content-['']
           hover:before:translate-x-[130%];
  }

  /* ---------- Cards ---------- */
  .card{ @apply rounded-2xl border border-line bg-paper p-6 shadow-card; }
  .card-dark{ @apply rounded-2xl border border-white/10 bg-navy-700 p-6 shadow-warm-dark; }
  /* Opt-in hover lift, added alongside .card. */
  .card-lift{
    @apply transition duration-300 ease-lift hover:-translate-y-0.5 hover:border-violet/20 hover:shadow-warm-md;
  }

  .pill{
    @apply inline-flex items-center gap-2 rounded-full border border-line bg-white
           px-3.5 py-2 text-sm font-medium text-ink;
  }
  .dot{ @apply size-1.5 shrink-0 rounded-full bg-violet; }

  .stat-card{
    @apply flex h-full flex-col rounded-2xl border border-line bg-white p-5
           transition duration-300 hover:border-violet/20;
  }
  .stat-num{
    @apply mb-3 font-display text-[2.75rem] font-bold leading-none tabular-nums
           tracking-[-0.04em] text-violet lg:text-[3.25rem];
  }
  .stat-label{ @apply mb-1 text-sm font-semibold leading-snug text-balance text-ink; }
  .stat-sub{ @apply text-sm leading-relaxed text-ink-soft; }
  .stat-source{
    @apply mt-auto border-t border-line pt-3 font-sans text-xs text-ink-soft;
  }


  .format-card{
    @apply flex h-full flex-col rounded-2xl border border-line bg-white p-5
           transition duration-300 hover:border-violet/20;
  }
  .format-icon{
    @apply flex size-7 shrink-0 items-center justify-center rounded-lg bg-violet/10 text-violet;
  }
  .format-heading{
    @apply mb-3 flex items-center gap-2.5 font-display text-base font-bold text-ink;
  }
  .check-li{
    @apply flex items-start gap-2 text-sm leading-snug text-ink-soft;
  }
  .check-mark{
    @apply mt-0.5 inline-flex size-[15px] shrink-0 items-center justify-center rounded-full
           bg-violet/10 font-sans text-[9px] font-bold leading-none text-violet;
  }

  .outcome-panel{
    @apply mt-8 grid gap-3 sm:grid-cols-2 lg:grid-cols-4;
  }
  .outcome-cell{
    @apply rounded-2xl border border-violet/12 bg-[#F8F7FF] p-5;
  }
  .outcome-icon{
    @apply mb-3 flex size-9 items-center justify-center rounded-xl bg-white text-violet
           shadow-[0_1px_0_rgba(147,51,234,0.08)];
  }
  .outcome-title{
    @apply mb-1.5 font-display text-sm font-bold text-ink;
  }

  .role-shift-card{
    @apply flex h-full flex-col justify-center rounded-2xl border border-violet/15
           bg-[#F8F7FF] p-5;
  }

  /* ---------- Schedule ---------- */
  .day-card{
    @apply shadow-warm-sm transition duration-[400ms] ease-lift
           hover:-translate-y-[3px] hover:border-line-warm hover:shadow-warm-md;
  }
  .day-head{
    @apply relative bg-linear-[135deg,var(--color-navy),var(--color-navy-700)]
           after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:bg-linear-to-r
           after:from-gold after:to-transparent after:to-75% after:content-[''];
  }
  .slot{
    /* 76px keeps a full "16:30-17:30" on one line at the mono size below. */
    @apply -mx-2 grid grid-cols-[76px_1fr] gap-3 rounded-lg border-b border-line
           px-2 py-3.5 transition-colors duration-300 last:border-b-0
           hover:bg-violet/[0.04] sm:grid-cols-[88px_1fr];
  }
  .slot-time{ @apply pt-0.5 font-sans text-[12px] font-semibold tabular-nums tracking-tight text-violet; }
  .slot-title{ @apply mb-0.5 font-display text-sm font-bold leading-snug tracking-tight text-balance text-ink; }
  .slot-desc{ @apply text-sm leading-snug text-ink-soft; }
  .slot-speaker{
    @apply mt-2.5 flex items-center gap-2.5 rounded-xl border border-line bg-[#F8F7FF] px-2.5 py-2;
  }
  .slot-speaker-photo{
    @apply flex size-8 shrink-0 items-center justify-center rounded-full bg-violet/15
           font-display text-[10px] font-bold text-violet;
  }
  .slot-icon{
    @apply mt-0.5 flex size-6 shrink-0 items-center justify-center rounded-md bg-violet/8 text-violet;
  }

  /* ---------- Speakers & schools ---------- */
  .speaker-card{
    @apply shadow-warm-sm transition duration-[400ms] ease-lift
           hover:-translate-y-[5px] hover:border-line-warm hover:shadow-warm-md;
  }
  .speaker-photo{ @apply transition-transform duration-500 ease-lift group-hover:scale-105; }
  .speaker-tag{ @apply shadow-tag; }

  .school-tag{
    @apply flex items-center gap-2 rounded-field border border-line px-4 py-3 text-sm text-ink
           transition duration-300 ease-lift hover:-translate-y-0.5 hover:border-line-warm
           hover:bg-paper hover:shadow-chip;
  }

  /* ---------- Pricing ---------- */
  .plan-wrap{ @apply transition-transform duration-[400ms] ease-lift hover:-translate-y-1.5; }
  .plan{
    @apply relative shadow-warm-sm transition duration-[400ms] ease-lift
           group-hover:border-line-warm group-hover:shadow-warm-md;
  }
  .plan-badge{ @apply tracking-[0.14em] shadow-badge; }
  .plan-feature{ @apply flex items-start gap-2 text-sm; }

  /* ---------- Forms ---------- */
  .field-label{ @apply mb-2 block text-xs font-semibold tracking-[0.02em] text-ink; }
  .field{
    @apply w-full rounded-field border border-line bg-paper px-4 py-3.5 text-base text-ink
           placeholder:text-ink/40 focus:border-ink/35 focus:outline-none;
  }

  /* ---------- Nav (matched to EIL light nav) ---------- */
  .nav-link{
    @apply relative py-0.5 text-base font-medium text-ink/60 transition-colors hover:text-ink
           after:absolute after:inset-x-0 after:-bottom-2 after:h-px after:origin-left
           after:scale-x-0 after:bg-linear-to-r after:from-pink-light after:to-violet
           after:transition-transform after:duration-300 after:ease-in-out after:content-['']
           hover:after:scale-x-100;
  }
  .nav-link.is-active{ @apply text-ink after:scale-x-100; }

  .nav-toggle{ @apply cursor-pointer rounded-[10px] transition-colors duration-200 hover:bg-ink/6; }
